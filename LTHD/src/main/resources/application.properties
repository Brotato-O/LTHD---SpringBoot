spring.application.name=LTHD
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/LTHD}
spring.datasource.username=${DB_USERNAME:hbstudent}
spring.datasource.password=${DB_PASSWORD:hbstudent}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

jwt.signer-key=e9e35c1f00258024870881315ca6bc1008fc4b5dca1813da0683b489a0e9cc2e

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
#spring.data.redis.ssl.enabled=true

spring.cache.type=redis
spring.cache.redis.time-to-live=5m

# Ghi SQL vào terminal/log của ứng dụng
logging.level.org.hibernate.SQL=DEBUG

# Hiển thị giá trị parameter được bind vào SQL (chỉ bật khi debug local)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG